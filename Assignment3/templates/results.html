<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Results</title>
    <style>
        body {
            margin: auto;
            width: 95%;
            padding-left: 3%;
            padding-top: 1%;
        }
    </style>
</head>
<body>
    <h1>Quiz Results</h1>
    <p>Nice work, {{ name }}!</p>
    <p>You scored {{score}} out of {{num_questions}} questions correctly.</p>
    {% if score_history %}
        <h2>Score history</h2>
        <ol>
            {% for result in score_history %}
                <li>{{ result.score }} out of {{ result.num_questions }}</li>
            {% endfor %}
        </ol>
    {% endif %}
    <a href="{{url_for('quiz')}}">Retake Quiz</a>
    <br>
    <a href="{{ url_for('logout') }}">Sign Out</a>
</body>
</html>
